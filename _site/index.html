<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insider Trades</title>
<meta name="description" content="Publicly disclosed trades by Trump administration officials, members of Congress and insiders at Trump-linked companies, with links to every original filing.">
<meta name="theme-color" content="#0f1521">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Insider Trades">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <h1>Insider Trades</h1>
    <button id="refresh" class="icon-btn" title="Reload data" aria-label="Reload data">&#8635;</button>
  </div>
  <div id="freshness" class="freshness" role="status"></div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" data-route="feed" role="tab">Feed</button>
  <button class="tab" data-route="people" role="tab">People</button>
  <button class="tab" data-route="copy" role="tab">Copy check</button>
  <button class="tab" data-route="sources" role="tab">Sources</button>
</nav>

<main id="view" class="view"><div class="loading">Loading filings&hellip;</div></main>

<footer class="footer">
  <p>Every figure links to its original public filing. Amounts are shown exactly
     as reported &mdash; disclosure ranges are never converted to a single number.</p>
  <p class="disclaimer">A record of public filings and a backtest of them.
     Not investment advice.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
