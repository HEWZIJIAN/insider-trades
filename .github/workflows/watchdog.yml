name: Watchdog

# Second line of defence. The update workflow can fail in ways that leave no
# trace: GitHub silently disables scheduled workflows in a repository with no
# activity for 60 days, a schedule can be skipped under load, or a run can die
# before it writes anything.
#
# This job only reads the committed data and asks one question: is it fresh?
# It runs on its own schedule so it survives the update workflow breaking.
on:
  schedule:
    - cron: '17 */6 * * *'   # four times a day, offset off the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check how old the data is
        id: check
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, pathlib

          MAX_AGE_HOURS = 6
          meta = pathlib.Path("data/meta.json")

          if not meta.exists():
              print("stale=true")
              print("detail=data/meta.json does not exist - the update job has never succeeded")
              raise SystemExit(0)

          generated = json.loads(meta.read_text()).get("generated_at")
          if not generated:
              print("stale=true")
              print("detail=meta.json has no generated_at timestamp")
              raise SystemExit(0)

          age = (dt.datetime.now(dt.timezone.utc)
                 - dt.datetime.fromisoformat(generated)).total_seconds() / 3600
          print(f"age={age:.1f}")
          if age > MAX_AGE_HOURS:
              print("stale=true")
              print(f"detail=Data is {age:.1f} hours old (limit {MAX_AGE_HOURS}h). "
                    f"The update workflow has probably stopped running.")
          else:
              print("stale=false")
              print(f"detail=Data is {age:.1f} hours old - healthy")
          PY

      - name: Report
        run: echo "::notice::${{ steps.check.outputs.detail }}"

      - name: Alert that the feed has gone stale
        if: steps.check.outputs.stale == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -H "Title: Insider Trades has stopped updating" \
                 -H "Tags: rotating_light" -H "Priority: high" \
                 -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions" \
                 -d "${{ steps.check.outputs.detail }}" \
                 "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
          fi
          echo "::error::${{ steps.check.outputs.detail }}"
          exit 1

  # Scheduled workflows are disabled after 60 days without repository activity.
  # The update job commits data on most runs, which counts - but if it is
  # already broken, nothing else keeps the repo alive and even this watchdog
  # would eventually be switched off. This keeps a heartbeat regardless.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch the heartbeat file
        run: |
          mkdir -p .github
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/last-alive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-alive
          if git diff --staged --quiet; then
            echo "unchanged"
          else
            git commit -m "Keepalive heartbeat"
            git pull --rebase --autostash origin main && git push origin HEAD:main
          fi
